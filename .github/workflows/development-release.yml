name: Android development release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/development-release.yml, src/PokemonMove.App/PokemonMove.App.csproj]
permissions:
  contents: write
concurrency:
  group: pokemonmove-development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: |
          dotnet workload install maui-android --skip-manifest-update
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Test DS readers, editors and generation conversion
        run: dotnet test tests/PokemonMove.Engine.Tests/PokemonMove.Engine.Tests.csproj
      - name: Test bank persistence
        run: dotnet test tests/PokemonMove.Infrastructure.Tests/PokemonMove.Infrastructure.Tests.csproj
      - name: Build debug APK
        run: >-
          dotnet build src/PokemonMove.App/PokemonMove.App.csproj
          -p:RuntimeIdentifier=android-arm64
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Read app version
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/PokemonMove.App/PokemonMove.App.csproj").findtext(".//ApplicationDisplayVersion"))')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Prepare distribution
        run: |
          mkdir -p dist
          cp src/PokemonMove.App/bin/Debug/net10.0-android/android-arm64/io.github.mkyono06.pokemonmove-Signed.apk dist/PokemonMove-${{ env.TAG }}-android-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/PokemonMove-${{ env.TAG }}-android-arm64.apk
          git archive --format=tar.gz --prefix=PokemonMove-${{ env.TAG }}/ HEAD -o dist/PokemonMove-${{ env.TAG }}-source.tar.gz
          curl --fail --location https://codeload.github.com/kwsch/PKHeX/tar.gz/refs/tags/26.10.18 -o dist/PKHeX-26.10.18-source.tar.gz
          cd dist
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonMove-${{ env.TAG }}
          path: dist/*
      - name: Upload and publish development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "PokemonMove $TAG — DS・3DS 開発版" --notes-file "docs/releases/$TAG.md" --prerelease --draft
          fi
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease --draft=false
