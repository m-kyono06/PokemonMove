name: Android development release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/development-release.yml]
permissions:
  contents: write
concurrency:
  group: pokemonmove-v0.1.0-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          dotnet workload install maui-android --skip-manifest-update
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Test HGSS reader
        run: dotnet test tests/PokemonMove.Engine.Tests/PokemonMove.Engine.Tests.csproj
      - name: Build debug APK
        run: >-
          dotnet build src/PokemonMove.App/PokemonMove.App.csproj
          -p:RuntimeIdentifier=android-arm64
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Prepare distribution
        run: |
          mkdir -p dist
          cp src/PokemonMove.App/bin/Debug/net10.0-android/android-arm64/io.github.mkyono06.pokemonmove-Signed.apk dist/PokemonMove-v0.1.0-android-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/PokemonMove-v0.1.0-android-arm64.apk
          git archive --format=tar.gz --prefix=PokemonMove-v0.1.0/ HEAD -o dist/PokemonMove-v0.1.0-source.tar.gz
          curl --fail --location https://codeload.github.com/kwsch/PKHeX/tar.gz/refs/tags/26.10.18 -o dist/PKHeX-26.10.18-source.tar.gz
          cd dist
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonMove-v0.1.0
          path: dist/*
      - name: Upload and publish development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0 --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload v0.1.0 dist/* --clobber
          gh release edit v0.1.0 --target "$GITHUB_SHA" --prerelease --draft=false
